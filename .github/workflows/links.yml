name: check-links
on:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Check source and image URLs
        id: check
        continue-on-error: true
        run: node scripts/check-links.mjs --out "$RUNNER_TEMP/links-report.md"
      - name: Close resolved report issue
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'title:"Broken links"' --json number --jq '.[].number' || true)
          for i in $n; do gh issue close --repo "$GITHUB_REPOSITORY" "$i" --reason completed; done
      - name: Refresh report issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'title:"Broken links"' --json number --jq '.[].number' || true)
          for i in $n; do gh issue close --repo "$GITHUB_REPOSITORY" "$i" --reason completed; done
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Broken links found (weekly link check)" \
            --body-file "$RUNNER_TEMP/links-report.md"